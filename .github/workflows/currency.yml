name: Currency

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  currency:
    name: currency (macos-15)
    # GitHub cancelled both macos-15 and macos-15-intel before a runner accepted
    # them. macos-26-intel did accept a job. The extension still deploys to macOS 15
    # and the image's Xcode is 16+.
    runs-on: macos-26-intel
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          set -euo pipefail
          # TunaKit 1.14.0 ships a Swift 6.4 module interface. macos-15's default
          # Xcode is 16.4, so pick the newest Xcode 16+ installed on the image.
          selected="$(python3 .github/select-newest-xcode.py)"
          echo "Using $selected"
          echo "DEVELOPER_DIR=$selected/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$selected"
          xcodebuild -version
          xcrun swift --version

      - name: Test CurrencyCore
        run: swift test --package-path CurrencyExtension/CurrencyCore

      - name: Disable certificate signing
        run: |
          printf '%s\n' \
            'CODE_SIGNING_ALLOWED = NO' \
            'CODE_SIGNING_REQUIRED = NO' \
            'CODE_SIGN_IDENTITY = -' \
            'DEVELOPMENT_TEAM =' \
            > "$RUNNER_TEMP/ci-signing.xcconfig"
          printf 'XCODE_XCCONFIG_FILE=%s\n' "$RUNNER_TEMP/ci-signing.xcconfig" \
            >> "$GITHUB_ENV"

      - name: Build CurrencyExtension
        run: |
          xcodebuild build \
            -project CurrencyExtension/CurrencyExtension.xcodeproj \
            -scheme CurrencyExtension \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM=
