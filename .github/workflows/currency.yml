name: Currency

on:
  workflow_dispatch:
  push:
    branches: [codex/currency-swift64-ci]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  currency:
    name: currency (Swift 6.4)
    # TunaKit 1.22.0 requires Swift 6.4. macos-26 images only include Xcode 26.
    # Cross-compile both architectures while retaining the macOS 15 deployment target.
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          set -euo pipefail
          selected="$(python3 .github/select-newest-xcode.py)"
          echo "Using $selected"
          echo "DEVELOPER_DIR=$selected/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$selected"
          ./scripts/run-xcodebuild --output - -- -version
          xcrun swift --version

      - name: Test CurrencyCore
        run: swift test --package-path CurrencyExtension/CurrencyCore

      - name: Build CurrencyExtension
        run: |
          set -euo pipefail
          ./scripts/run-xcodebuild build \
            -project CurrencyExtension/CurrencyExtension.xcodeproj \
            -scheme CurrencyExtension \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS='arm64 x86_64' \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM=

      - name: Ad-hoc sign and zip the framework
        run: |
          set -euo pipefail
          settings="$(mktemp)"
          ./scripts/run-xcodebuild --output "$settings" -- \
            -project CurrencyExtension/CurrencyExtension.xcodeproj \
            -scheme CurrencyExtension \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS='arm64 x86_64' \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            -showBuildSettings
          target_build_dir="$(grep -m1 '^ *TARGET_BUILD_DIR = ' "$settings" | sed 's/.*= //')"
          product_name="$(grep -m1 '^ *FULL_PRODUCT_NAME = ' "$settings" | sed 's/.*= //')"
          framework="$target_build_dir/$product_name"
          test -d "$framework"
          # Tuna loads manual installs with library validation disabled. Ad-hoc
          # signing matches scripts/install-dev-bundle.sh when no team is set.
          codesign --force --sign - --timestamp=none "$framework"
          codesign -dv --verbose=2 "$framework"
          mkdir -p dist
          # ditto keeps the framework's symlinks, which a plain zip of the bundle can drop.
          ditto -c -k --keepParent "$framework" dist/CurrencyExtension.framework.zip
          unzip -l dist/CurrencyExtension.framework.zip | grep 'CurrencyExtension.framework/Versions/A/CurrencyExtension'

      - name: Upload importable framework
        uses: actions/upload-artifact@v7
        with:
          name: CurrencyExtension
          path: dist/CurrencyExtension.framework.zip
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CurrencyExtension-build-logs
          path: build/xcodebuild
          if-no-files-found: ignore
